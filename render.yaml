services:
  - type: web
    name: aurora-music
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: SERVE_STATIC
        value: "1"
      - key: NETEASE_MUSIC_API_URL
        value: http://127.0.0.1:3100
      - key: LLM_PROVIDER
        value: disabled
